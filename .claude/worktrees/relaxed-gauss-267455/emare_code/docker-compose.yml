version: '3.9'

services:
  emrecode:
    image: emarecloud/emrecode:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    
    # Network
    networks:
      - emarecloud_network
    ports:
      - "${LISTEN_PORT:-9870}:9870"
    
    # Environment
    environment:
      # Core config
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 9870
      DEV_MODE: "false"
      
      # Database
      DB_URL: "sqlite+aiosqlite:////data/emrecode.db"
      DB_AUTO_CREATE: "true"
      
      # Hub connection
      HUB_URL: "${HUB_URL:-http://127.0.0.1:9860}"
      HUB_TOKEN_FILE: "/tmp/.fleet-token"
      
      # vCenter (optional)
      VCENTER_HOST: "${VCENTER_HOST:-}"
      VCENTER_USER: "${VCENTER_USER:-}"
      VCENTER_PASS: "${VCENTER_PASS:-}"
      VCENTER_INSECURE: "${VCENTER_INSECURE:-true}"
      
      # Ollama
      OLLAMA_HOST: "${OLLAMA_HOST:-http://ollama:11434}"
      
      # Dervish metadata
      DERVISH_ID: "${DERVISH_ID:-default}"
      DERVISH_PROFILE: "${DERVISH_PROFILE:-general}"
      ORG_ID: "${ORG_ID:-org_local}"
      PROJECT_ID: "${PROJECT_ID:-project_local}"
    
    # Volumes
    volumes:
      # Persistent database
      - emrecode_data:/data
      # Workspace (mount from host or NFS)
      - ${WORKSPACE_PATH:-/tmp/emrecode_workspace}:/workspace
    
    # Resources (per-derviş limits)
    deploy:
      resources:
        limits:
          cpus: "${RESOURCE_CPU:-2}"
          memory: "${RESOURCE_MEMORY:-2G}"
        reservations:
          cpus: "${RESOURCE_CPU_RESERVE:-1}"
          memory: "${RESOURCE_MEMORY_RESERVE:-1G}"
      labels:
        - "app=emrecode"
        - "dervish_id=${DERVISH_ID:-default}"
    
    # Health check (via API)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    
    depends_on:
      - ollama
      # Note: Ollama might take time to become "healthy", so we don't wait for it
      # Emrecode will retry connections to Ollama with exponential backoff

  # Ollama daemon (shared, can be external)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-daemon
    hostname: ollama
    restart: unless-stopped
    
    networks:
      - emarecloud_network
    
    ports:
      - "11434:11434"
    
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
    
    volumes:
      # Persistent model storage
      - ollama_models:/models
      # Ollama home directory
      - ollama_home:/.ollama
    
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPU:-6}"
          memory: "${OLLAMA_MEMORY:-32G}"
        reservations:
          cpus: "${OLLAMA_CPU_RESERVE:-4}"
          memory: "${OLLAMA_MEMORY_RESERVE:-24G}"
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

# Volumes
volumes:
  emrecode_data:
    name: emrecode_data_${DERVISH_ID:-default}
    driver: local
  ollama_models:
    name: ollama_models
    driver: local
  ollama_home:
    name: ollama_home
    driver: local

# Networks
networks:
  emarecloud_network:
    driver: bridge
    name: emarecloud_network

version: '3.9'

# Emrecode + Ollama Stack for Docker Swarm
# Deploy with: docker stack deploy -c emrecode-swarm-stack.yml emrecode-fleet

services:
  # Emrecode FastAPI server
  emrecode:
    image: emarecloud/emrecode:latest
    hostname: "{{.Node.Hostname}}-emrecode"
    restart: on-failure
    
    networks:
      - emarecloud
    
    ports:
      - target: 9870
        published: 9870
        protocol: tcp
        mode: ingress
    
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 9870
      DEV_MODE: "false"
      DB_URL: "sqlite+aiosqlite:////data/emrecode.db"
      DB_AUTO_CREATE: "true"
      HUB_URL: "http://dergah-gate:9860"
      OLLAMA_HOST: "http://ollama:11434"
      DERVISH_PROFILE: "general"
      ORG_ID: "org_local"
      PROJECT_ID: "project_local"
    
    volumes:
      - emrecode_data:/data
      - /data/emrecode_workspace:/workspace
    
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role != manager
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "1"
          memory: "1G"
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "app=emrecode"
        - "monitored=true"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    
    depends_on:
      - ollama

  # Ollama LLM Daemon (global on workers)
  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    restart: unless-stopped
    
    networks:
      - emarecloud
    
    ports:
      - target: 11434
        published: 11434
        protocol: tcp
        mode: host
    
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
    
    volumes:
      - ollama_models:/models
      - ollama_home:/.ollama
    
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: "8"
          memory: "48G"
        reservations:
          cpus: "4"
          memory: "32G"
      labels:
        - "app=ollama"
        - "monitored=true"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Prometheus Exporter for Emrecode
  emrecode-exporter:
    image: prom/node-exporter:latest
    hostname: emrecode-exporter
    restart: unless-stopped
    
    networks:
      - emarecloud
    
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
    
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    
    volumes:
      - /:/host:ro,rslave
    
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.1"
          memory: "256M"
      labels:
        - "app=exporter"
        - "monitored=true"
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Volumes
volumes:
  emrecode_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2G"
  ollama_models:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.100,vers=4,soft,timeo=180,bg,tcp,rw"
      device: ":/export/ollama_models"
  ollama_home:
    driver: local

# Networks
networks:
  emarecloud:
    driver: overlay
    driver_opts:
      com.docker.network.driver.overlay.vxlanid: "4096"
    attachable: true

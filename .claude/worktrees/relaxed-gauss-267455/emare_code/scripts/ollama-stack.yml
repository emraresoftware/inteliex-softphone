version: '3.9'

# Ollama Daemon Stack for Swarm Deployment
# Deploy with: docker stack deploy -c ollama-stack.yml ollama-fleet

services:
  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    restart: unless-stopped
    
    networks:
      - emarecloud
    
    ports:
      - target: 11434
        published: 11434
        protocol: tcp
        mode: host
    
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_GPU: "${OLLAMA_GPU_COUNT:-0}"
    
    volumes:
      # Persistent model storage on NFS or shared volume
      - ollama_models:/models
      - ollama_home:/.ollama
    
    deploy:
      mode: global
      placement:
        constraints:
          # Run on worker nodes for resource efficiency
          - node.role == worker
      resources:
        limits:
          cpus: "${OLLAMA_CPU:-6}"
          memory: "${OLLAMA_MEMORY:-32G}"
        reservations:
          cpus: "${OLLAMA_CPU_RESERVE:-4}"
          memory: "${OLLAMA_MEMORY_RESERVE:-24G}"
      labels:
        - "app=ollama-daemon"
        - "monitored=true"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

# Ollama Load Balancer (optional, routes requests)
  ollama-lb:
    image: traefik:latest
    hostname: ollama-lb
    restart: unless-stopped
    
    networks:
      - emarecloud
    
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    
    command:
      - "--api.dashboard=false"
      - "--providers.docker.swarmmode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.http.address=:11434"
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: "512M"
    
    depends_on:
      - ollama

# Shared volumes
volumes:
  ollama_models:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-127.0.0.1},vers=4,soft,timeo=180,bg,tcp,rw"
      device: "${NFS_MODELS_PATH:-/export/ollama_models}"
  ollama_home:
    driver: local

# Swarm network
networks:
  emarecloud:
    driver: overlay
    driver_opts:
      com.docker.network.driver.overlay.vxlanid: "4096"
    attachable: true

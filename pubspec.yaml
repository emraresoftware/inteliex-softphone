name: inteliex_softphone
description: Inteliex Softphone mobile MVP
publish_to: 'none'
version: 0.4.4+26

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  abto_voip_sdk:
    path: ABTO_VoIP_SDK_Mobile_Flutter_20250825/abto_voip_sdk
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  package_info_plus: ^8.3.0
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.1
  path_provider: ^2.1.6
  # QR ile kurulum (claim provisioning) akisi: kamera QR tarama + deeplink.
  # Dart SDK >=3.4.0 ile uyumlu son stabil surumler secildi.
  mobile_scanner: ^6.0.11
  app_links: ^6.4.0
  # Telefonun kendi rehberini (cihaz kisilerini) uygulama rehberinde gostermek icin.
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

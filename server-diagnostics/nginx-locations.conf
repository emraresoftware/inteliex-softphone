location = /api/v1/diagnostics/softphone {
    limit_req zone=softphone_diagnostics burst=20 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8765/ingest;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
}

location = /api/v1/diagnostics/softphone/events {
    proxy_pass http://127.0.0.1:8765/events;
    proxy_set_header Authorization $http_authorization;
}
